[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-intake-core"
version = "0.1.0"
description = "Shared types + outbox helper for CAIA Vision Intake"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10",
]

[tool.setuptools.packages.find]
where = ["src"]

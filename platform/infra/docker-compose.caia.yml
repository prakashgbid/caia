# CAIA Software Factory — control-plane deploy stack (STOL-1034)
#
# Reuse doctrine: LiteLLM (Kernel-5) is ALREADY deployed on stolution and NOT
# re-declared here — it is referenced as an external service on the shared
# stolution-network. Kafka + MinIO are also already up; this file only adds
# TOPICS + BUCKETS init (idempotent) plus the missing kernels: Temporal (K-1),
# OPA (K-3), Context Compiler (K-7), and the Wizard UI slot.
#
# All services join `stolution-network` (external), plus a private
# `caia-network` for kernel-to-kernel traffic.
#
# Zero recurring cost — every image below is OSS on Docker Hub / ghcr.io.

networks:
  stolution-network:
    external: true
  caia-network:
    driver: bridge

volumes:
  caia-opa-bundle:
  caia-context-cache:

services:
  # ─────────────────────────────────────────────────────────────────────────
  # Kernel-1  Temporal — REUSED from existing stolution-temporal container
  # (already on stolution-network + monitoring; do NOT redeploy).
  # We only add a UI pointed at the shared cluster.
  # ─────────────────────────────────────────────────────────────────────────
  caia-temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: caia-temporal-ui
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: stolution-temporal:7233
      TEMPORAL_UI_PUBLIC_PATH: ""
    ports:
      - "8189:8080"
    networks: [caia-network, stolution-network]

  # ─────────────────────────────────────────────────────────────────────────
  # Kernel-2  Kafka topics init  (reuses stolution-kafka on stolution-network)
  # ─────────────────────────────────────────────────────────────────────────
  caia-kafka-init:
    image: apache/kafka:3.8.0
    container_name: caia-kafka-init
    restart: "no"
    depends_on: []
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        BROKER="stolution-kafka:9092"
        KT=/opt/kafka/bin/kafka-topics.sh
        TOPICS=(
          "caia.factory.commit.result:6:1"
          "caia.factory.ci.result:6:1"
          "caia.factory.functional.result:6:1"
          "caia.factory.requires_rework:6:1"
          "caia.factory.artifact.published:6:1"
          "caia.factory.evidence.appended:6:1"
          "caia.governance.kill:1:1"
        )
        for t in "$${TOPICS[@]}"; do
          IFS=':' read -r name parts rf <<< "$$t"
          $$KT --bootstrap-server $$BROKER --create --if-not-exists \
            --topic $$name --partitions $$parts --replication-factor $$rf || true
        done
        $$KT --bootstrap-server $$BROKER --list
    networks: [stolution-network]

  # ─────────────────────────────────────────────────────────────────────────
  # Kernel-3  OPA policy engine
  # ─────────────────────────────────────────────────────────────────────────
  caia-opa:
    image: openpolicyagent/opa:latest-rootless
    container_name: caia-opa
    environment:
      - OPA_DOCKER_IMAGE_TAG=
    restart: unless-stopped
    command:
      - "run"
      - "--server"
      - "--addr=:8181"
      - "--log-level=info"
      - "/policies"
    volumes:
      - ./opa:/policies:ro
    ports:
      - "8181:8181"
    networks: [caia-network, stolution-network]
    healthcheck:
      # OPA rootless image is distroless — no wget/curl. Use OPA's built-in
      # `opa eval` against a trivial in-memory expression as liveness proof.
      test: ["CMD", "/opa", "eval", "1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────────
  # Kernel-4  MinIO buckets init (reuses stolution-minio)
  # ─────────────────────────────────────────────────────────────────────────
  caia-minio-init:
    image: minio/mc:latest
    container_name: caia-minio-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set stol http://stolution-minio:9000 "$${MINIO_ROOT_USER:-minioadmin}" "$${MINIO_ROOT_PASSWORD:-minioadmin}"
        for b in caia-artifacts caia-evidence caia-traces caia-cache; do
          mc mb --ignore-existing "stol/$$b"
          mc version enable "stol/$$b" || true
        done
        mc ls stol/ | grep caia-
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-stolution}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-stolution_minio_secret_2026}
    networks: [stolution-network]

  # ─────────────────────────────────────────────────────────────────────────
  # Kernel-7  Context Compiler
  # ─────────────────────────────────────────────────────────────────────────
  caia-context-compiler:
    # Kernel-7 — full implementation is in apps/caia-context-compiler (WIP).
    # Runs a minimal placeholder /health endpoint until that codebase is
    # complete; contract stays the same so consumers can be wired now.
    image: python:3.12-slim
    container_name: caia-context-compiler
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../apps/caia-context-compiler:/src:ro
      - caia-context-cache:/cache
    environment:
      CTX_CACHE_DIR: /cache
      CTX_LOG_LEVEL: info
      LITELLM_URL: http://litellm:4000
      KAFKA_BROKERS: stolution-kafka:9092
      MINIO_ENDPOINT: http://stolution-minio:9000
    command:
      - "python"
      - "-c"
      - |
        import http.server, socketserver, json
        class H(http.server.BaseHTTPRequestHandler):
          def do_GET(self):
            if self.path in ("/health","/","/ready"):
              body = json.dumps({"status":"ok","kernel":"kernel-7","factory":"caia-context-compiler","state":"placeholder"}).encode()
              self.send_response(200); self.send_header("Content-Type","application/json")
              self.send_header("Content-Length",str(len(body))); self.end_headers(); self.wfile.write(body)
            else:
              self.send_response(404); self.end_headers()
          def log_message(self, *a): pass
        with socketserver.TCPServer(("",8090), H) as s:
          print("caia-context-compiler placeholder listening :8090"); s.serve_forever()
    ports:
      - "8190:8090"
    networks: [caia-network, stolution-network]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8090/health').read()\""]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────────────
  # Wizard UI (Founder Platform — separate agent's deliverable)
  # Static placeholder until the other agent ships their Next.js bundle.
  # ─────────────────────────────────────────────────────────────────────────
  caia-wizard-ui:
    image: nginx:1.27-alpine
    container_name: caia-wizard-ui
    restart: unless-stopped
    volumes:
      - ./wizard-placeholder:/usr/share/nginx/html:ro
    ports:
      - "8191:80"
    networks: [caia-network, stolution-network]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────────────────────
  # Prometheus scrape config (adds CAIA jobs to the existing Prom instance
  # by mounting an additional file_sd file into stolution-observability)
  # ─────────────────────────────────────────────────────────────────────────
  caia-prom-sd:
    image: alpine:3.20
    container_name: caia-prom-sd
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /shared/prometheus/file_sd
        cp /config/caia_targets.yml /shared/prometheus/file_sd/caia_targets.yml
        echo "wrote caia_targets.yml"
        ls -la /shared/prometheus/file_sd/
    volumes:
      - ./prometheus:/config:ro
      - /home/s903/config/observability:/shared
    networks: [caia-network]
